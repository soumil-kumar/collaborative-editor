version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=change-this-in-production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - collab-python
      - collab-node
      - collab-cpp
      - collab-go

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

  # Pre-built sandbox images (built once, reused per execution)
  collab-python:
    build:
      context: ./docker
      dockerfile: Dockerfile.python
    image: collab-python
    command: echo "image ready"

  collab-node:
    build:
      context: ./docker
      dockerfile: Dockerfile.node
    image: collab-node
    command: echo "image ready"

  collab-cpp:
    build:
      context: ./docker
      dockerfile: Dockerfile.cpp
    image: collab-cpp
    command: echo "image ready"

  collab-go:
    build:
      context: ./docker
      dockerfile: Dockerfile.go
    image: collab-go
    command: echo "image ready"
